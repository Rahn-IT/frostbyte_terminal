name: Build Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and publish Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json |
            Select-Object -ExpandProperty packages |
            Where-Object name -eq "frostbyte_term" |
            Select-Object -ExpandProperty version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match frostbyte_term version $version"
          }

      - name: Build release binary for Windows
        run: cargo build --release --locked --package frostbyte_term

      - name: Name release binary
        shell: pwsh
        run: Copy-Item target/release/frostbyte_term.exe "frostbyte_terminal-${{ github.ref_name }}-windows-x86_64.exe"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "frostbyte_terminal-${{ github.ref_name }}-windows-x86_64.exe"
          --repo "${{ github.repository }}"
          --title "Frostbyte Terminal ${{ github.ref_name }}"
          --generate-notes
          --verify-tag
